# ============================================================
#  ai-life 配置文件
#  复制一份改名为 config.yaml 再填写。带 ★ 的是必填项。
# ============================================================

# 她运行时不让电脑自动睡眠（Windows；屏幕照常熄灭，合盖 / 手动睡眠 / 关机不受影响）。电脑睡着了她就收不到消息
keep_awake: true

# 时区（决定早安晚安、免打扰的时间）
timezone: Asia/Shanghai

# 大模型接口需要代理时填（比如 http://127.0.0.1:7890）。不需要就留空 ""
# 例：http://127.0.0.1:7890  或  socks5://127.0.0.1:7890
proxy: "http://127.0.0.1:7890"

# 人设文件（可以写好几个角色，换这里就行）
persona_file: persona/linxi.md       # 自带的人设：linxi.md（林汐，温柔的插画编辑）、shenyan.md（沈言，男友向）
                                     # 自己写：复制 persona/template.md；或者 python run.py persona new / persona import 角色卡.png

# ---------------- 大模型 ----------------
# 程序里不内置任何接口：在电脑上打开小屋“设置 → 大模型”加（或者 python run.py llm / scripts\llm.bat），
# 填接口地址和 Key → 测连通、列出模型 → 选一个 → 试一下 → 勾上它干什么。加的写进 config.llm.yaml，Key 进 .env。
# 任何 OpenAI 兼容的接口都行：云上的大模型服务、本机 Ollama（http://127.0.0.1:11434/v1）、LM Studio、vLLM……
#
# 也可以在这里手写：
#   profiles:
#     my_chat:
#       base_url: https://你的接口地址/v1
#       api_key: "${MY_CHAT_KEY}"        # Key 放 .env：MY_CHAT_KEY=sk-...
#       model: 模型名
#       extra_body: {}                   # 可选：比如推理模型关掉思考
#       use_proxy: false                 # 可选：这个接口要走上面的代理
#   routes:
#     chat: [my_chat]
#
# 用途（routes）：chat 聊天、主动消息 ★ 至少要有一个
#                 helper 其它小活    memory 整理记忆    night 日记 / 日程 / 来信（这三个不配就用上一级，最后用 chat）
#                 vision 看你发的图  image 画她的照片  embed 记忆检索的向量（这三个不配就不做）
llm:
  temperature: 0.9
  max_tokens: 800
  background_yield_seconds: 25   # 聊天优先：你刚聊完的这么多秒内，后台的整理记忆、写日记先等一等
  profiles: {}
  routes: {}

# ---------------- 记忆检索 ----------------
# 关键词 + 语义向量混合检索。向量用 routes.embed 里的模型；没配或者接口不可用时只用关键词，不影响聊天。
memory:
  embed:
    enabled: true

# ---------------- QQ 私聊（需要 NapCat，见 docs/QQ.md） ----------------
qq:
  enabled: true
  ws_url: "ws://127.0.0.1:3001"   # NapCat 里开的“WebSocket 服务器”地址
  access_token: ""               # NapCat 里设的 token（没设就留空）
  napcat_hidden: true            # NapCat 在后台跑（不开窗口，输出在 data/logs/napcat.log）
  napcat_autostart: true         # 开 start.bat 时 NapCat 没在运行，就顺便启动它（Windows）
  napcat_dir: ""                 # NapCat 文件夹，比如 D:\NapCat.Shell.Windows.Node（qq_setup 会写；空着就自动找）
  napcat_qq: 0                   # 她小号的 QQ 号：启动 NapCat 时用来快速登录，不用每次扫码（qq_setup 会写）
  http_url: ""                   # 可选：NapCat 的 HTTP 服务器（比如 http://127.0.0.1:3000），关程序道别时的备用通道
  owner_id: 0                    # ★ 你自己的 QQ 号（不是她的小号）：私聊只认这个号
  owner_name: ""                 # 你在她的世界里是谁（一般写在人设的 user_name / call_name 里；这里是没写时的备用）
  private: true                  # 私聊（命令、信、纪念册、道别都走 QQ）
  poke_back: 0.4                 # 你戳她时，她戳回去的概率
  signature: true                # 她的 QQ 个性签名每天跟着她的安排和心情变（每天一次，心情大变时最多 4 小时一次）
                                 # QQ 群：用单独的程序 ai-life-group（另一个小号），这里只管私聊

# ---------------- 拟人化 ----------------
style:
  context_messages: 40        # 每次带给模型的最近消息条数
  typing_chars_per_sec: 6     # 打字速度（字/秒），决定每条气泡之间的停顿
  max_typing_delay: 6         # 单条最多“打字”几秒
  merge_wait_seconds: 4       # 你连发几条时，等你说完再一起回（秒）
  sticker_rate: 0.4           # 她想发表情包时，实际发出去的概率（1=每次都发）
  typo_rate: 0.03             # 偶尔打错一个字、过两秒再改过来（0 关闭）

# ---------------- 主动消息 ----------------
proactive:
  enabled: true
  check_every_minutes: 10     # 多久“想一下要不要找你”
  quiet_hours: "00:30-08:00"  # 免打扰时段（这段时间她不会主动找你）
  min_gap_minutes: 90         # 两次主动消息的最短间隔
  active_window_minutes: 30   # 你最近这么久内说过话，就不插嘴
  base_per_day: 2.0           # 平均每天随机主动几次（不含早安晚安）
  longing_per_hour: 0.03      # 你越久不说话，她越想你：每小时增加的触发概率
  max_unanswered: 3           # 连续几次没回就不再主动（直到你回来）
  max_per_day: 8              # 一天最多主动找你几次（含早安晚安；到点提醒、纪念日不受限）
  morning: "08:00-09:30"      # 早安时间窗口（留空关闭）
  night: "23:00-23:50"        # 晚安时间窗口（留空关闭）

# ---------------- 电脑关机 / 睡眠期间 ----------------
away:
  enabled: true
  catch_up_minutes: 120       # 电脑关着（或睡眠）超过这么久，回来后她会说说这段时间在干嘛，并补上错过的提醒、纪念日、来信
  wait_seconds: 90            # 开机后先等这么久：你这段时间给她发过消息的话，就在回你时顺便说，不再单独发
  goodbye: true               # 关掉程序（Ctrl+C、关窗口、关机）时，她说一句“我先去忙/睡了”
  goodbye_min_gap_hours: 3    # 两次道别至少隔这么久（来回重启时不刷屏）

# ---------------- 外面的世界 ----------------
world:
  city: ""                    # 你所在的城市（也可以私聊发 /city 上海）；天气用 Open-Meteo/wttr.in，免费
  schedule: ""                # 你的作息/课表（也可以发 /schedule …）

# ---------------- 她的照片 ----------------
# 用 routes.image 里的画图模型（OpenAI 兼容的 /images/generations）；没配就不发照片。长相写在人设的 look 里。
photo:
  enabled: true
  size: 768x1344              # 竖屏手机照片
  max_per_day: 3              # 每天最多发几张

# ---------------- 小屋网页 ----------------
web:
  enabled: true
  host: 127.0.0.1             # 只在本机能打开（放在服务器上时用 scripts/open_home 开 SSH 隧道，在自己电脑浏览器看）
  port: 8765                  # 浏览器打开 http://127.0.0.1:8765

# ---------------- 感知你在做什么 ----------------
sense:
  phone:
    enabled: true             # 手机快捷指令向 ntfy 频道发“起床/到家/充电”，她就知道（频道名用 /sense 查看）
    ntfy_server: https://ntfy.sh
    ntfy_topic: ""            # 留空自动生成一个私密频道名

# ---------------- 她自己的生活 ----------------
story:
  enabled: true               # 她自己的故事线：一周到一个月的连续事件（考试周、社团活动、朋友的事……）
  max_active: 2               # 同时最多几条
mind:
  enabled: true               # 内心独白：清醒时每隔几小时在后台想一想，决定要不要找你
  think_every_hours: 3

# ---------------- 说话质量 ----------------
quality:
  enabled: true               # 不重复自己：和最近说过的话太像、开头重复、称呼/口头禅用太多 → 自动重写
  similarity: 0.62            # 多像算重复（0~1，越小越严格）
  catchphrases: []            # 口头禅（最近用过两次就先别用）；一般写在人设文件的 catchphrases 里
  weekly_report: true         # 每周一上午私聊发一份“这一周她的表现”（只是统计，不是她在说话）

# ---------------- 备份 ----------------
backup:
  extra_dir: auto             # 每天再复制一份数据库到别处：auto＝OneDrive 里的 ai-life-backup（没装 OneDrive 就跳过）；
                              # 也可以写一个文件夹路径（比如 U 盘、网盘同步文件夹）；off＝不要

# ---------------- 每周来信 ----------------
letter:
  enabled: true
  weekday: 6                  # 0=周一 … 6=周日
  time: "21:00-22:30"

# ---------------- 小游戏 ----------------
games:
  mistake_rate: 0.25          # 井字棋里她“失误”的概率（0=永远最优，你最多打平）

# ---------------- 她的世界（第六批） ----------------
her_world:
  enabled: true               # 她身边固定的人（室友、朋友、老师……）+ 她自己的长期目标
  max_goals: 2                # 同时最多几个长期目标
  age: 19                     # 第一次运行时她几岁（以后每过一次生日长一岁）
  birthday: ""                # 她的生日 MM-DD；留空自动挑一个（不会在最近两个月）
  school:                     # 她的校历（按真实日期推算学期、第几周、考试周、寒暑假、年级）
    enabled: true
    fall_start: "09-01"
    fall_exams: "01-05"       # 上学期期末考试周开始
    winter_break: "01-17"     # 寒假开始（下学期开学那天结束）
    spring_start: "02-23"
    spring_exams: "06-22"
    summer_break: "07-05~08-31"

# ---------------- 睡前 ----------------
bedtime:
  enabled: true
  window: "21:00-04:00"       # 睡前时段（你说想听睡前故事时，她会单独讲一个，用文字发）

# ---------------- 他分享的链接 ----------------
links:
  enabled: true               # 你发 B站 / 公众号 / 网页 / YouTube 链接，她会先点开看标题、简介和正文开头再回你
  max_chars: 700              # 正文最多读多少字给她


# ---------------- 软件更新 ----------------
update:
  auto_check: true            # 每天看一次 GitHub 上有没有新版本（只看，不会自己装；在小屋里点“更新”才装）
  repo: star031104/ai-life    # 从哪个仓库更新
  gitee: ""                   # 国内连 GitHub 慢：在 Gitee 上导入这个仓库，填 “你的用户名/ai-life”，会先从它下载
