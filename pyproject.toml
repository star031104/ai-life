[project]
name = "ai-life"
dynamic = ["version"]
description = "有自己生活的 AI 伴侣：QQ 私聊的有希，和 QQ 群、微信群里的她"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.setuptools.dynamic]
version = { attr = "ailife.__version__" }

[tool.setuptools.packages.find]
include = ["ailife*", "aigroup*"]

[tool.setuptools.package-data]
ailife = ["web/*.html", "web/*.css"]
aigroup = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", "napcat", ".venv", "home"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "E402", "E731", "B008", "B904", "B905", "E741", "B023", "B007"]
