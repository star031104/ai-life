# 群聊角色的配置（第二个角色，和一对一的她互不相干）
# 用法：复制成 config.group.yaml，改好下面打 ★ 的地方，双击 start_group.bat
# 想再加一个群聊角色：再复制一份（比如 config.group2.yaml），改 instance_root / persona_file / ws_url，
#   然后用 start_group.bat config.group2.yaml 启动

extends: config.yaml            # 先继承你 config.yaml 里的大模型、代理设置，下面的覆盖它
mode: group                     # 只跑群聊（不启动 Telegram、私聊、桌宠、小屋、电脑感知）
instance_root: instances/qq-group   # 这个角色的数据（数据库、日志）放这里，和一对一的她分开
persona_file: persona/xiaoman.md    # ★ 她的人设（先找 instance_root 里的，没有就用程序目录下的）

qq:
  enabled: true
  ws_url: "ws://127.0.0.1:3002"  # ★ 第二个 NapCat 账号的 WebSocket 端口（别和一对一那个的 3001 撞）
  access_token: ""
  owner_id: 123456789            # ★ 你自己的 QQ 号（她把你当群里的老朋友）
  private: false
  groups: [987654321]            # ★ 她待的群
  aliases: ["小满", "满满"]       # 群里这样叫也算叫她
  group:
    relation: friend             # 你对她来说是普通的好朋友（不是“哥哥”）
    owner_note: "把你拉进群的老朋友，爱和你互损"
    interject_chance: 0.08       # 群聊角色可以比一对一的她更爱插话
    owner_chance: 0.15
    max_per_10min: 6
    idle_hours: 3                # 群里安静 3 小时以上，她可能自己冒个泡
    idle_chance: 0.25
    active_hours: "10:00-23:30"

proactive:
  quiet_hours: "00:30-09:00"     # 这段时间只回叫到她的消息，也不冒泡
